 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <!-- CSS ဖိုင်နဲ့ ချိတ်ဆက်ခြင်း -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>

        <!-- Task ရိုက်ထည့်မယ့်နေရာ -->
        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button id="addBtn" type="button">Add Task</button>
        </div>

        <!-- Task တွေ ပေါ်လာမယ့်နေရာ -->
        <ul id="taskList"></ul>
    </div>

    <!-- JavaScript ဖိုင်နဲ့ ချိတ်ဆက်ခြင်း -->
    <script src="script.js"></script>

</body>
</html>
